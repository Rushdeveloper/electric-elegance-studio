name: KRISHNA ELECTRICIAN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Pages configuration
        run: |
          cat > vite.config.pages.ts <<'EOF'
          import { defineConfig } from "@lovable.dev/vite-tanstack-config";

          export default defineConfig({
            vite: {
              base: "/electric-elegance-studio/",
            },
            tanstackStart: {
              spa: {
                enabled: true,
              },
              server: {
                entry: "server",
              },
            },
            nitro: false,
          });
          EOF

      - name: Build website
        run: bunx vite build --config vite.config.pages.ts

      - name: Prepare static website
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
